name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Test and build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Run SmartSense source tests
        run: npm test

      - name: Generate Android project
        run: npx cap add android

      - name: Set professional app display name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)
          strings_path = Path("android/app/src/main/res/values/strings.xml")
          tree = ET.parse(strings_path)
          root = tree.getroot()
          app_name = root.find("./string[@name='app_name']")
          if app_name is None:
              app_name = ET.SubElement(root, "string", {"name": "app_name"})
          app_name.text = "SmartSense"
          tree.write(strings_path, encoding="utf-8", xml_declaration=True)
          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          manifest_tree = ET.parse(manifest_path)
          manifest_root = manifest_tree.getroot()
          manifest_root.set("{" + android_ns + "}label", "SmartSense")
          manifest_tree.write(manifest_path, encoding="utf-8", xml_declaration=True)
          print("Android launcher label set to SmartSense")
          PY

      - name: Sync app into Android project
        run: npx cap sync android

      - name: Compile debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --verbose android/app/build/outputs/apk/debug/app-debug.apk

      # Publish the signed APK before the optional emulator smoke test, so a
      # slow or unavailable emulator cannot block the user's download.
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartSense-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        timeout-minutes: 8
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.smartsense.inventory 1
            sleep 5
            adb shell pidof com.smartsense.inventory
